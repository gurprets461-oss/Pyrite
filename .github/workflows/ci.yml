name: CI

on:
  push:
    # Docs and the wheel-building workflow don't affect the app.
    paths-ignore: ['**.md', 'wheels/**', '.github/workflows/wheels.yml', '.github/workflows/probe.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Cache Python downloads
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Set up SDK
        run: scripts/setup-sdk.sh

      - name: Fetch Python
        run: scripts/fetch-python.sh

      - name: Build and unit test
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest test 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|FAILED|Test.*>.*FAILED' -A4 build.log | head -150 | tee build-errors.txt || true

      - name: Upload build errors
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-errors
          path: build-errors.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests

  instrumented:
    name: Instrumented tests (emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          add-job-summary: never

      - name: Cache Python downloads
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up SDK
        run: scripts/setup-sdk.sh

      - name: Fetch Python
        run: scripts/fetch-python.sh

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/ci-instrumented.sh

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-summary
          path: |
            test-summary.txt
            test-errors.txt
          if-no-files-found: ignore

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  # A short log to read results from: test summary and build errors only.
  report:
    name: Report
    needs: [build, instrumented]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: '{test-summary,build-errors}'
          merge-multiple: true
      - name: Results
        run: |
          echo "build: ${{ needs.build.result }}  instrumented: ${{ needs.instrumented.result }}"
          for f in build-errors.txt test-errors.txt test-summary.txt; do
            [ -f "$f" ] && { echo "=== $f"; cat "$f"; }
          done
          true
