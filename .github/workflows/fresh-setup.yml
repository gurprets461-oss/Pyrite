# M0 acceptance check: on a machine with no SDK, the setup scripts alone are
# enough for `./gradlew assembleDebug` to succeed.
name: Fresh setup

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/fresh-setup.yml'
  workflow_dispatch:

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Point at an empty directory so the runner's preinstalled SDK isn't used.
      ANDROID_HOME: ${{ github.workspace }}/../fresh-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../fresh-sdk
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      ANDROID_NDK: ''
      ANDROID_NDK_LATEST_HOME: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: setup-sdk.sh && fetch-python.sh && ./gradlew assembleDebug
        run: |
          test ! -e "$ANDROID_HOME"
          scripts/setup-sdk.sh && scripts/fetch-python.sh && ./gradlew assembleDebug
          ls -l app/build/outputs/apk/debug/app-debug.apk
          ls "$ANDROID_HOME"
