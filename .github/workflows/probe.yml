name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          $S --list 2>/dev/null | grep -E '^ +(cmake;|cmdline-tools;|build-tools;3[6-9]|emulator|platform-tools)' | sort -u
          cat $ANDROID_HOME/cmdline-tools/latest/source.properties; ls $ANDROID_HOME/cmake
          cat $ANDROID_HOME/platforms/android-37.0/source.properties
          curl -sSL https://dl.google.com/android/repository/repository2-3.xml | python3 -c "
          import sys,re; x=sys.stdin.read()
          for m in re.finditer(r'<remotePackage path=\"cmdline-tools;([^\"]+)\">(.*?)</remotePackage>', x, re.S):
              print(m.group(1), re.findall(r'<url>(commandlinetools-linux[^<]*)</url>', m.group(2)), re.findall(r'<checksum type=\"sha1\">([^<]*)', m.group(2))[:3])
          "
