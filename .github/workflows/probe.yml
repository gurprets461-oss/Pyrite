name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: versions
        run: |
          m() { curl -sSL "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -v -E 'alpha|beta|rc|dev' | tail -3 | tr '\n' ' '; echo " <- $1"; }
          for p in com/android/tools/build/gradle androidx/compose/compose-bom androidx/activity/activity-compose androidx/core/core-ktx \
            androidx/lifecycle/lifecycle-runtime-ktx androidx/lifecycle/lifecycle-viewmodel-compose androidx/navigation/navigation-compose \
            androidx/test/runner androidx/test/ext/junit androidx/test/core androidx/test/rules androidx/test/espresso/espresso-core \
            androidx/test/uiautomator/uiautomator androidx/test/orchestrator androidx/test/services/test-services androidx/documentfile/documentfile \
            androidx/compose/material/material-icons-extended com/android/tools/build/aapt2; do m $p; done
      - name: python
        run: |
          curl -sSL "https://www.python.org/api/v2/downloads/release_file/?release=1165" | python3 -c "import json,sys; [print({k:v for k,v in x.items() if k in ('name','url','sha256_sum','md5_sum','filesize')}) for x in json.load(sys.stdin) if 'ndroid' in x['url']]"
          for a in aarch64 x86_64; do f=python-3.15.1-$a-linux-android.tar.gz; curl -sSfLO https://www.python.org/ftp/python/3.15.1/$f && sha256sum $f && stat -c %s $f; done
          tar tzf python-3.15.1-x86_64-linux-android.tar.gz | grep -v -E 'prefix/(include|lib/python3.15)/' | head -80
          tar tzf python-3.15.1-x86_64-linux-android.tar.gz | grep -E 'prefix/lib/python3.15/[^/]+/?$' | head -300 | tr '\n' ' '
