name: Probe (temporary)
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: redroid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r) adb >/dev/null
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder && echo "binder ok"
          docker run -itd --rm --privileged --name redroid -p 5555:5555 redroid/redroid:14.0.0-latest
          adb version | head -1
          for i in $(seq 1 60); do
            adb connect localhost:5555 >/dev/null 2>&1 || true
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$b" = "1" ] && { echo "booted after $((i*5))s"; break; }
            sleep 5
          done
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist
          adb -s localhost:5555 shell getprop ro.build.version.sdk
          adb -s localhost:5555 shell uname -m
          adb -s localhost:5555 shell wm size
          adb -s localhost:5555 shell ping -c 1 -W 5 pypi.org || echo "no ping"
          docker logs redroid 2>&1 | tail -5
